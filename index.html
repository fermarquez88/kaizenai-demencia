<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kaizen·AI — Riesgo de progresión a demencia</title>
<meta name="description" content="Calculadora de riesgo de progresión a demencia y declive cognitivo. Prototipo de investigación — no es un dispositivo médico.">
</head>

<style>
  :root{
    --paper:#fbfcfc;--card:#fff;--ink:#15201f;--muted:#5a6b6a;--line:#e4eaea;--line2:#eef3f3;
    --primary:#0b6b70;--primary-deep:#073e42;--wash:#e6f1f1;--low:#2f8f6f;--mid:#c39433;--high:#b0453b;--ink-serif:#101a19;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
  .serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;color:var(--ink-serif)}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
  .wrap{max-width:1020px;margin:0 auto;padding:0 22px}
  h1,h2,h3{text-wrap:balance;margin:0}
  a{color:var(--primary-deep)}
  .eyebrow{font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;color:var(--primary);font-weight:700}
  header{border-bottom:1px solid var(--line);background:linear-gradient(180deg,#f4f9f9,#fbfcfc)}
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:16px 0}
  .brand .logo{font-weight:700;letter-spacing:-.02em;color:var(--primary-deep);font-size:1.15rem}
  .brand .logo b{color:var(--high)} .brand .tag{font-size:.72rem;color:var(--muted);margin-left:8px}
  .langtog{display:flex;border:1px solid var(--line);border-radius:20px;overflow:hidden;font-size:.78rem}
  .langtog button{border:0;background:#fff;padding:5px 12px;cursor:pointer;color:var(--muted);font-weight:600}
  .langtog button.on{background:var(--primary);color:#fff}
  .hero{padding:24px 0 28px}
  .hero h1{font-size:clamp(1.7rem,3.8vw,2.4rem);font-weight:600;line-height:1.1;margin:.3em 0}
  .hero p{max-width:64ch;color:var(--muted);margin:0}
  .disclaimer{margin-top:14px;display:inline-flex;gap:8px;align-items:center;background:#fdf6ec;border:1px solid #efd9b8;color:#8a5a12;border-radius:8px;padding:7px 12px;font-size:.8rem}
  .layout{display:grid;grid-template-columns:minmax(0,390px) 1fr;gap:24px;padding:28px 0 10px;align-items:start}
  @media(max-width:820px){.layout{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
  .panel h2{font-size:1.02rem;font-weight:600} .panel .hint{font-size:.78rem;color:var(--muted);margin:2px 0 12px}
  .step{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--primary);font-weight:700;margin:14px 0 4px;display:flex;align-items:center;gap:7px}
  .step .n{background:var(--primary);color:#fff;width:17px;height:17px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:.66rem}
  .field{margin:10px 0}
  .field label{display:block;font-size:.82rem;font-weight:600;margin-bottom:4px}
  .field .u{color:var(--muted);font-weight:400;font-size:.75rem}
  .field input,.field select{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:.92rem;font-family:inherit;background:#fff;color:var(--ink)}
  .field input:focus,.field select:focus{outline:2px solid var(--wash);border-color:var(--primary)}
  .field .warn{font-size:.72rem;color:var(--high);margin-top:3px;display:none} .field.oor .warn{display:block} .field.oor input{border-color:var(--high)}
  .modelchip{margin-top:12px;background:var(--wash);border:1px solid #cfe6e7;border-radius:8px;padding:9px 12px;font-size:.82rem;color:var(--primary-deep)}
  .modelchip b{font-weight:700}
  .rescard{background:var(--card);border:1px solid #bfe0e1;border-radius:14px;padding:20px 22px;box-shadow:0 0 0 3px #f0f7f7}
  .rescard h3{font-size:1.04rem;font-weight:600} .rescard .sub{font-size:.79rem;color:var(--muted);margin-bottom:12px}
  .riskrow{display:flex;align-items:flex-end;gap:14px}
  .riskval{font-size:2.7rem;font-weight:700;line-height:.95;letter-spacing:-.02em}
  .riskband{font-size:.82rem;color:var(--muted);padding-bottom:7px} .risklabel{font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:20px;align-self:center}
  .scale{margin:16px 0 6px;position:relative;height:46px}
  .scale .track{position:absolute;top:16px;left:0;right:0;height:10px;border-radius:5px;background:linear-gradient(90deg,#e7f2ee,#f3ecd9 50%,#f6e2de);border:1px solid var(--line)}
  .scale .ci{position:absolute;top:16px;height:10px;background:rgba(11,107,112,.22);border-radius:5px}
  .scale .pt{position:absolute;top:11px;width:3px;height:20px;background:var(--primary-deep);border-radius:2px}
  .scale .prev{position:absolute;top:8px;height:26px;border-left:2px dashed #9aa}
  .scale .prev span{position:absolute;top:-14px;left:-16px;font-size:.62rem;color:var(--muted);white-space:nowrap}
  .scale .ax{position:absolute;top:30px;width:100%;display:flex;justify-content:space-between;font-size:.66rem;color:var(--muted)}
  .rescard .meta{display:flex;gap:16px;flex-wrap:wrap;font-size:.75rem;color:var(--muted);margin-top:12px;border-top:1px solid var(--line2);padding-top:10px}
  .rescard .meta b{color:var(--ink)} .na{color:var(--muted);font-size:.9rem;padding:26px 4px;text-align:center}
  .note{font-size:.8rem;color:var(--muted);margin-top:12px} .note.warnc{color:var(--high)}
  section.info{padding:32px 0 10px;border-top:1px solid var(--line);margin-top:24px}
  section.info h2{font-size:1.35rem;font-weight:600}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}@media(max-width:760px){.grid3{grid-template-columns:1fr}}
  .icard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px} .icard .k{font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;color:var(--primary);font-weight:700}
  .icard p{font-size:.88rem;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:.86rem;margin-top:8px} th,td{text-align:left;padding:8px 9px;border-bottom:1px solid var(--line2)}
  th{font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)} td.n,th.n{text-align:right;font-variant-numeric:tabular-nums} .scroll{overflow-x:auto}
  footer{border-top:1px solid var(--line);margin-top:28px;padding:22px 0 60px;color:var(--muted);font-size:.82rem}
  .pillbtn{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:6px 12px;margin-right:8px;text-decoration:none;color:var(--primary-deep);font-weight:600;font-size:.82rem;background:#fff}
  .tag2{font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;color:var(--primary-deep);border:1px solid #bfe0e1;border-radius:5px;padding:2px 7px;background:var(--wash)}
</style>

<header><div class="wrap">
  <div class="topbar">
    <div class="brand"><span class="logo">Kaizen<b>·</b>AI</span><span class="tag" data-i18n="brand_tag"></span></div>
    <div class="langtog"><button id="es" class="on" onclick="setLang('es')">ES</button><button id="en" onclick="setLang('en')">EN</button></div>
  </div>
  <div class="hero">
    <div class="eyebrow" data-i18n="eyebrow"></div>
    <h1 class="serif" data-i18n="title"></h1>
    <p data-i18n="lede"></p>
    <div class="disclaimer">⚠️ <span data-i18n="disclaimer"></span></div>
  </div>
</div></header>

<div class="wrap">
  <div class="layout">
    <div class="panel">
      <h2 data-i18n="form_title"></h2>
      <div class="hint" data-i18n="form_hint"></div>
      <div class="step"><span class="n">1</span><span data-i18n="step1"></span></div>
      <div class="field">
        <select id="sev_ord" onchange="onSev()">
          <option value="0" data-i18n="sev0"></option>

          <option value="3" data-i18n="sev3"></option>
          <option value="4" data-i18n="sev4"></option>
          <option value="5" data-i18n="sev5"></option>
        </select>
      </div>
      <div class="modelchip" id="modelchip"></div>
      <div class="step"><span class="n">2</span><span data-i18n="step2"></span></div>
      <div id="dynfields"></div>
    </div>
    <div><div id="results"></div><p class="note" id="globalnote"></p></div>
  </div>

  <section class="info">
    <div class="eyebrow" data-i18n="sci_eyebrow"></div>
    <h2 class="serif" data-i18n="sci_title"></h2>
    <div class="grid3">
      <div class="icard"><div class="k" data-i18n="sci_how_k"></div><p data-i18n="sci_how"></p></div>
      <div class="icard"><div class="k" data-i18n="sci_valid_k"></div><p data-i18n="sci_valid"></p></div>
      <div class="icard"><div class="k" data-i18n="sci_limit_k"></div><p data-i18n="sci_limit"></p></div>
    </div>
    <div class="panel" style="margin-top:16px">
      <h3 style="font-size:.95rem" data-i18n="perf_title"></h3>
      <div class="scroll"><table id="perftable"></table></div>
      <p class="hint" style="margin-top:8px" data-i18n="perf_note"></p>
    </div>
  </section>

  <footer>
    <div style="margin-bottom:10px">
      <a class="pillbtn" href="#" target="_blank" rel="noopener">↗ <span data-i18n="foot_code"></span></a>
      <a class="pillbtn" href="#" target="_blank" rel="noopener">↗ <span data-i18n="foot_paper"></span></a>
    </div>
    <p data-i18n="foot_note"></p>
    <p class="mono" style="font-size:.75rem" data-i18n="foot_cite"></p>
  </footer>
</div>

let LANG='es';
const sig=z=>1/(1+Math.exp(-z));
const SEVV=()=>parseFloat(document.getElementById('sev_ord').value);
function primaryKey(){const s=SEVV();return s>=3?'declive_fiable':(s==1?'demencia_dclleve':'demencia_predem');}
function stdvec(m){return m.features.map(f=>{let raw=f.name==='sev_ord'?SEVV():VALS[f.name];if(raw==null||isNaN(raw))raw=f.median;return (raw-f.mean)/f.std;});}
function pcal(c,i,A,B,xs){let lin=i;for(let k=0;k<xs.length;k++)lin+=c[k]*xs[k];return sig(A*lin+B);}
function predict(m){const xs=stdvec(m);const p=pcal(m.coef,m.intercept,m.platt.A,m.platt.B,xs);
 const bs=m.bootstrap.map(b=>pcal(b.coef,b.intercept,b.A,b.B,xs)).sort((a,b)=>a-b);
 return {p,lo:bs[Math.floor(bs.length*.025)],hi:bs[Math.floor(bs.length*.975)]};}
function fmtP(x){return (100*x).toFixed(0)+'%';}
function riskClass(p){return p<.20?['low','low']:p<.40?['mid','mid']:['high','high'];}

   const mt=FIELD_META[n];const d=document.createElement('div');d.className='field';

   cont.appendChild(d);const el=d.querySelector('input');if(VALS[n]!=null)el.value=VALS[n];
   el.addEventListener('input',()=>{VALS[n]=el.value===''?null:parseFloat(el.value);compute();});
 });
 document.getElementById('modelchip').innerHTML=`${I18N[LANG].modelchip} <b>${NAMES[key][LANG=='es'?0:1]}</b> · AUC ${m.metrics.auc}`;
}

 // out-of-range
 document.querySelectorAll('#dynfields .field').forEach(f=>f.classList.remove('oor'));
 m.features.forEach(f=>{if(f.name==='sev_ord')return;const v=VALS[f.name];if(v==null)return;const el=document.getElementById('fld_'+f.name);if(el&&Math.abs((v-f.mean)/f.std)>3)el.closest('.field').classList.add('oor');});
 const need=m.features.some(f=>f.name!=='sev_ord'&&VALS[f.name]!=null);
 let inner=`<div class="rescard"><h3>${NAMES[key][li]}</h3><div class="sub">${DESCS[key][li]}</div>`;
 if(!need){inner+=`<div class="na">${T.need}</div></div>`;document.getElementById('globalnote').textContent='';}
 else{
   const r=predict(m),[cls,lab]=riskClass(r.p),col=cls=='low'?'var(--low)':cls=='mid'?'var(--mid)':'var(--high)',prev=m.prevalencia*100;
   inner+=`<div class="riskrow"><div class="riskval mono" style="color:${col}">${fmtP(r.p)}</div>
     <span class="risklabel" style="background:${col}22;color:${col}">${T[lab]}</span>
     <div class="riskband mono">${T.ci} ${fmtP(r.lo)}–${fmtP(r.hi)}</div></div>
     <div class="scale"><div class="track"></div><div class="ci" style="left:${r.lo*100}%;width:${Math.max(1,(r.hi-r.lo)*100)}%"></div>
       <div class="pt" style="left:calc(${r.p*100}% - 1.5px)"></div><div class="prev" style="left:${prev}%"><span>${T.prev} ${prev.toFixed(0)}%</span></div>
       <div class="ax"><span>0%</span><span>50%</span><span>100%</span></div></div>
     <div class="meta"><span>${T.m_auc} <b>${m.metrics.auc}</b> <span class="mono">[${m.metrics.ci[0]},${m.metrics.ci[1]}]</span></span><span>${T.m_n} <b>${m.n} / ${m.eventos}</b></span><span>${T.m_cal} ✓</span></div>`;
   if(SEVV()>=3)inner+=`<div class="note warnc">${T.already}</div>`;
   inner+=`</div>`;document.getElementById('globalnote').textContent=T.note_sel;
 }
 box.innerHTML=inner;
}
function onSev(){renderFields();compute();}
function perftable(){const p=document.getElementById('perftable'),nm={demencia_dclleve:['Demencia · DCL leve','Dementia · MCI'],demencia_predem:['Demencia · pre-demencia','Dementia · pre-dementia'],declive_fiable:['Declive fiable','Reliable decline'],conversion_banda:['Conversión de banda','Band conversion']};
 const order=['demencia_dclleve','demencia_predem','declive_fiable','conversion_banda'],li=LANG=='es'?0:1;
 p.innerHTML=`<tr><th>${LANG=='es'?'Desenlace':'Outcome'}</th><th class="n">AUC</th><th class="n">IC95%</th><th class="n">n / ${LANG=='es'?'ev':'ev'}</th></tr>`+
  order.map(k=>`<tr><td>${nm[k][li]}</td><td class="n mono">${MODELS[k].metrics.auc}</td><td class="n mono">${MODELS[k].metrics.ci[0]}–${MODELS[k].metrics.ci[1]}</td><td class="n mono">${MODELS[k].n} / ${MODELS[k].eventos}</td></tr>`).join('');}
function setLang(l){LANG=l;document.getElementById('es').classList.toggle('on',l=='es');document.getElementById('en').classList.toggle('on',l=='en');
 document.querySelectorAll('[data-i18n]').forEach(e=>{const k=e.getAttribute('data-i18n');if(I18N[l][k]!=null)e.textContent=I18N[l][k];});
 renderFields();compute();perftable();}
document.getElementById('sev_ord').addEventListener('change',onSev);
setLang('es');
</script>
